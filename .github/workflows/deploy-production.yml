name: Deploy to Production

# Triggers on version tags - e.g. git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  deployments: write
  id-token: write   # npm trusted publishing of zenit-week-mcp (OIDC, no stored token)

jobs:
  deploy:
    name: Deploy to zenitweek.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Run tests
        run: npm ci && npm test

      # The agent server ships with the app: one release carries the app, the
      # npm package and the Claude Desktop extension (agent-bridge-setup.md
      # section 3). The extension is built first because it has no side effects;
      # the package is published before the app goes live, so a page never
      # meets a server older than itself for longer than this job takes.
      - name: Build the Claude Desktop extension
        run: npm run mcp:bundle

      - name: Publish zenit-week-mcp to npm (only when its version is new)
        run: node scripts/mcp-publish.mjs --if-new

      - name: Create GitHub deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments \
            --input - \
            --jq '.id' <<EOF
          {
            "ref": "${{ github.ref_name }}",
            "environment": "production",
            "description": "Deploy ${{ github.ref_name }}",
            "auto_merge": false,
            "required_contexts": []
          }
          EOF
          )
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel (production)
        run: npx vercel --prod --yes
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Mark deployment success
        if: success() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=success \
            -f environment_url=https://zenitweek.com \
            -f description="Deployed to production"

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if node scripts/extract-release-notes.mjs "${{ github.ref_name }}" > "$NOTES_FILE" 2>/dev/null && [ -s "$NOTES_FILE" ]; then
            echo "Using CHANGELOG.md section for ${{ github.ref_name }}"
            gh release create "${{ github.ref_name }}" mcp/dist/zenit-week.mcpb \
              --title "${{ github.ref_name }}" \
              --notes-file "$NOTES_FILE"
          else
            echo "No CHANGELOG.md section for ${{ github.ref_name }} - falling back to auto-generated notes"
            gh release create "${{ github.ref_name }}" mcp/dist/zenit-week.mcpb \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
          # Every app release carries the extension, so Settings' Download link
          # (releases/latest/download/zenit-week.mcpb) always finds it.

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=failure \
            -f description="Production deploy failed"
