name: Deploy to Production

# Triggers on version tags — e.g. git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Deploy to zenitweek.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Run tests
        run: npm ci && npm test

      - name: Create GitHub deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments \
            --input - \
            --jq '.id' <<EOF
          {
            "ref": "${{ github.ref_name }}",
            "environment": "production",
            "description": "Deploy ${{ github.ref_name }}",
            "auto_merge": false,
            "required_contexts": []
          }
          EOF
          )
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel (production)
        run: npx vercel --prod --yes
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Mark deployment success
        if: success() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=success \
            -f environment_url=https://zenitweek.com \
            -f description="Deployed to production"

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if node scripts/extract-release-notes.mjs "${{ github.ref_name }}" > "$NOTES_FILE" 2>/dev/null && [ -s "$NOTES_FILE" ]; then
            echo "Using CHANGELOG.md section for ${{ github.ref_name }}"
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file "$NOTES_FILE"
          else
            echo "No CHANGELOG.md section for ${{ github.ref_name }} — falling back to auto-generated notes"
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=failure \
            -f description="Production deploy failed"
