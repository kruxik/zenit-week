# git-cliff configuration — Zenit Week
# Generates CHANGELOG.md sections from Conventional Commits, formatted as
# Keep a Changelog. Tag scheme is CalVer: vYYYY.MM.DD[.N].

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project uses [CalVer](https://calver.org/) — `vYYYY.MM.DD[.N]`.

"""

body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}

"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$"
topo_order = false
sort_commits = "newest"

commit_parsers = [
    { message = "^feat",     group = "Added" },
    { message = "^fix",      group = "Fixed" },
    { message = "^perf",     group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^revert",   group = "Changed" },
    { message = "^security", group = "Security" },
    { message = "^copy",     group = "Changed" },
    { message = "^ui",       group = "Changed" },
    { message = "^i18n",     group = "Changed" },
    { body = ".*BREAKING CHANGE", group = "Removed" },
    { message = "^docs",     skip = true },
    { message = "^chore",    skip = true },
    { message = "^test",     skip = true },
    { message = "^ci",       skip = true },
    { message = "^build",    skip = true },
    { message = "^style",    skip = true },
]
