<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2a2a4e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="1"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- ══ LEFT: brand + headline ══ -->
  <g transform="translate(80, 90)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- Logo -->
    <g transform="translate(0, 0)">
      <text x="0" y="36" font-size="36" font-weight="300" fill="#fff">Zen</text>
      <path d="M 79,28 C 91,28 91,18 95,18" fill="none" stroke="#A259FF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 79,28 C 91,28 91,38 95,38" fill="none" stroke="#1ABCFE" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="74" cy="28" r="6" fill="#fff"/>
      <circle cx="98" cy="18" r="4.5" fill="#A259FF"/>
      <circle cx="98" cy="38" r="4.5" fill="#1ABCFE"/>
      <text x="106" y="36" font-size="36" font-weight="700" fill="#fff">it</text>
      <text x="138" y="36" font-size="36" font-weight="300" fill="#fff"> Week</text>
    </g>

    <!-- Headline -->
    <text x="0" y="200" font-size="64" font-weight="300" fill="#fff" letter-spacing="-1.5">Plánujte to,</text>
    <text x="0" y="280" font-size="64" font-weight="700" fill="#fff" letter-spacing="-1.5">na čem záleží.</text>

    <!-- Subtitle -->
    <text x="0" y="360" font-size="26" font-weight="400" fill="rgba(255,255,255,0.65)">Vizuální plánovač týdne.</text>
    <text x="0" y="398" font-size="26" font-weight="400" fill="rgba(255,255,255,0.65)">Bez registrace. Bez serverů. Zdarma.</text>

    <!-- URL -->
    <text x="0" y="490" font-size="22" font-weight="600" fill="#1ABCFE">zenitweek.com</text>
  </g>

  <!-- ══ RIGHT: mini mind-map ══ -->
  <g transform="translate(720, 0)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">

    <!-- Connectors -->
    <path d="M140,295 C90,295 75,155 30,155"  fill="none" stroke="#F24E1E" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round"/>
    <path d="M140,335 C90,335 75,475 30,475"  fill="none" stroke="#A259FF" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round"/>
    <path d="M280,295 C330,295 345,155 390,155" fill="none" stroke="#1ABCFE" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round"/>
    <path d="M280,335 C330,335 345,475 390,475" fill="none" stroke="#19C82A" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round"/>

    <!-- Center -->
    <rect x="140" y="285" width="140" height="60" rx="18" fill="#fff" filter="url(#soft-shadow)"/>
    <text x="210" y="324" text-anchor="middle" font-size="18" fill="#1a1a2e" font-weight="700">Váš týden</text>

    <!-- Práce (top-left) -->
    <rect x="-30" y="130" width="120" height="50" rx="14" fill="#F24E1E" filter="url(#soft-shadow)"/>
    <text x="30" y="163" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">Práce</text>

    <!-- Rodina (bottom-left) -->
    <rect x="-30" y="450" width="120" height="50" rx="14" fill="#A259FF" filter="url(#soft-shadow)"/>
    <text x="30" y="483" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">Rodina</text>

    <!-- Já (top-right) -->
    <rect x="330" y="130" width="120" height="50" rx="14" fill="#1ABCFE" filter="url(#soft-shadow)"/>
    <text x="390" y="163" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">Já</text>

    <!-- Růst (bottom-right) -->
    <rect x="330" y="450" width="120" height="50" rx="14" fill="#19C82A" filter="url(#soft-shadow)"/>
    <text x="390" y="483" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">Růst</text>

  </g>
</svg>
