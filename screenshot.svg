<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a2e" flood-opacity="0.08"/>
    </filter>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a2e" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1280" height="720" fill="#eceef2"/>

  <!-- ── Browser chrome ── -->
  <g>
    <rect x="40" y="40" width="1200" height="640" rx="14" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="40" y="40" width="1200" height="40" rx="14" fill="#f4f5f7"/>
    <rect x="40" y="64" width="1200" height="16" fill="#f4f5f7"/>
    <!-- Traffic lights -->
    <circle cx="64"  cy="60" r="6" fill="#ff5f57"/>
    <circle cx="84"  cy="60" r="6" fill="#febc2e"/>
    <circle cx="104" cy="60" r="6" fill="#28c840"/>
    <!-- URL pill -->
    <rect x="430" y="48" width="420" height="24" rx="12" fill="#ffffff" stroke="#e1e3e8" stroke-width="1"/>
    <text x="640" y="64" text-anchor="middle" font-size="12" fill="#6b6b80" font-weight="500">zenitweek.com/app</text>
  </g>

  <!-- ── App toolbar ── -->
  <g transform="translate(60, 100)">
    <!-- Week pill -->
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#1a1a2e"/>
    <text x="90" y="24" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Week 19 · Mon 5 May</text>

    <!-- Prev/Next/Today -->
    <g transform="translate(196, 0)">
      <rect x="0"  y="0" width="38" height="38" rx="10" fill="#fff" stroke="#e1e3e8"/>
      <path d="M22,12 L14,19 L22,26" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="0" width="78" height="38" rx="10" fill="#fff" stroke="#e1e3e8"/>
      <text x="85" y="24" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Today</text>
      <rect x="132" y="0" width="38" height="38" rx="10" fill="#fff" stroke="#e1e3e8"/>
      <path d="M148,12 L156,19 L148,26" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- View pills (Sand / Pebbles / Rocks) -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="240" height="38" rx="19" fill="#fff" stroke="#e1e3e8"/>
      <rect x="4" y="4" width="76" height="30" rx="15" fill="#1a1a2e"/>
      <text x="42"  y="24" text-anchor="middle" font-size="13" fill="#fff"     font-weight="600">Sand</text>
      <text x="120" y="24" text-anchor="middle" font-size="13" fill="#6b6b80" font-weight="600">Pebbles</text>
      <text x="200" y="24" text-anchor="middle" font-size="13" fill="#6b6b80" font-weight="600">Rocks</text>
    </g>

    <!-- Right side: Mindmap / Agenda + Settings -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#fff" stroke="#e1e3e8"/>
      <rect x="4" y="4" width="86" height="30" rx="15" fill="#1a1a2e"/>
      <text x="47"  y="24" text-anchor="middle" font-size="13" fill="#fff"    font-weight="600">Mindmap</text>
      <text x="135" y="24" text-anchor="middle" font-size="13" fill="#6b6b80" font-weight="600">Agenda</text>

      <!-- Settings -->
      <rect x="200" y="0" width="38" height="38" rx="10" fill="#fff" stroke="#e1e3e8"/>
      <circle cx="219" cy="19" r="4" fill="none" stroke="#1a1a2e" stroke-width="1.8"/>
      <path d="M219,12 L219,9 M219,29 L219,26 M212,19 L209,19 M229,19 L226,19" stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ── Mind-map canvas ── -->
  <g transform="translate(0, 0)">

    <!-- Connectors (drawn first, behind nodes) -->
    <!-- Center → Work (top-left) -->
    <path d="M540,400 C400,400 360,250 240,250" fill="none" stroke="#F24E1E" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
    <!-- Center → Family (mid-left) -->
    <path d="M540,420 C400,420 360,420 240,420" fill="none" stroke="#A259FF" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
    <!-- Center → Me (top-right) -->
    <path d="M740,400 C880,400 920,250 1040,250" fill="none" stroke="#1ABCFE" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
    <!-- Center → Growth (bottom-right) -->
    <path d="M740,420 C880,420 920,580 1040,580" fill="none" stroke="#19C82A" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- Sub-connectors: Work children -->
    <path d="M240,238 C200,238 180,180 140,180" fill="none" stroke="#F24E1E" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M240,250 C200,250 180,250 140,250" fill="none" stroke="#F24E1E" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M240,262 C200,262 180,320 140,320" fill="none" stroke="#F24E1E" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- Sub-connectors: Family children -->
    <path d="M240,408 C200,408 180,400 140,400" fill="none" stroke="#A259FF" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M240,432 C200,432 180,470 140,470" fill="none" stroke="#A259FF" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- Sub-connectors: Me children -->
    <path d="M1160,238 C1190,238 1200,180 1230,180" fill="none" stroke="#1ABCFE" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M1160,250 C1190,250 1200,250 1230,250" fill="none" stroke="#1ABCFE" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M1160,262 C1190,262 1200,320 1230,320" fill="none" stroke="#1ABCFE" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- Sub-connectors: Growth children -->
    <path d="M1160,568 C1190,568 1200,540 1230,540" fill="none" stroke="#19C82A" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M1160,592 C1190,592 1200,620 1230,620" fill="none" stroke="#19C82A" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- ══ Center node ══ -->
    <g filter="url(#node-shadow)">
      <rect x="540" y="384" width="200" height="64" rx="20" fill="#1a1a2e"/>
    </g>
    <text x="640" y="411" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.55)" font-weight="500">Week 19 · 5 – 11 May</text>
    <text x="640" y="432" text-anchor="middle" font-size="16" fill="#fff" font-weight="300">Zen<tspan font-weight="700">it</tspan> Week</text>

    <!-- ══ Work branch ══ -->
    <rect x="240" y="226" width="120" height="48" rx="14" fill="#F24E1E" filter="url(#node-shadow)"/>
    <text x="300" y="256" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Work</text>

    <!-- Work children -->
    <!-- Q2 Report (high priority — thicker border) -->
    <rect x="60" y="160" width="80" height="40" rx="10" fill="#FFF0ED" stroke="#F24E1E" stroke-width="2"/>
    <text x="100" y="185" text-anchor="middle" font-size="11" fill="#D03000" font-weight="600">Q2 Report</text>

    <!-- AI course -->
    <rect x="60" y="232" width="80" height="36" rx="10" fill="#FFF0ED" stroke="#F24E1E" stroke-width="1" stroke-opacity="0.4"/>
    <text x="100" y="255" text-anchor="middle" font-size="11" fill="#D03000" font-weight="500">AI course</text>

    <!-- Team 1:1s — done -->
    <rect x="60" y="302" width="80" height="36" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <text x="96" y="325" text-anchor="middle" font-size="11" fill="#aaa" font-weight="500" text-decoration="line-through">Team 1:1s</text>
    <circle cx="130" cy="320" r="6" fill="#2d9e4f"/>
    <path d="M127,320 L129,322 L133,317" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- ══ Family branch ══ -->
    <rect x="240" y="396" width="120" height="48" rx="14" fill="#A259FF" filter="url(#node-shadow)"/>
    <text x="300" y="426" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Family</text>

    <!-- Family children -->
    <rect x="60" y="382" width="80" height="36" rx="10" fill="#F3EBFF" stroke="#A259FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="100" y="405" text-anchor="middle" font-size="11" fill="#7000FF" font-weight="500">Dinner</text>

    <rect x="60" y="452" width="80" height="36" rx="10" fill="#F3EBFF" stroke="#A259FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="100" y="475" text-anchor="middle" font-size="11" fill="#7000FF" font-weight="500">Hike</text>

    <!-- ══ Me branch ══ -->
    <rect x="1040" y="226" width="120" height="48" rx="14" fill="#1ABCFE" filter="url(#node-shadow)"/>
    <text x="1100" y="256" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Me</text>

    <!-- Me children (right side mirror of left) -->
    <!-- Pushups counter -->
    <rect x="1140" y="160" width="80" height="40" rx="10" fill="#E8F8FF" stroke="#1ABCFE" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1170" y="185" text-anchor="middle" font-size="11" fill="#0070A0" font-weight="500">Pushups</text>
    <rect x="1192" y="172" width="26" height="16" rx="6" fill="#1ABCFE" opacity="0.16"/>
    <text x="1205" y="184" text-anchor="middle" font-size="9" fill="#0070A0" font-weight="700">6/10</text>

    <!-- Meditation -->
    <rect x="1140" y="232" width="80" height="36" rx="10" fill="#E8F8FF" stroke="#1ABCFE" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1180" y="255" text-anchor="middle" font-size="11" fill="#0070A0" font-weight="500">Meditation</text>

    <!-- Read 30 min — done -->
    <rect x="1140" y="302" width="80" height="36" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <text x="1176" y="325" text-anchor="middle" font-size="11" fill="#aaa" font-weight="500" text-decoration="line-through">Read 30m</text>
    <circle cx="1212" cy="320" r="6" fill="#2d9e4f"/>
    <path d="M1209,320 L1211,322 L1215,317" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- ══ Growth branch ══ -->
    <rect x="1040" y="556" width="120" height="48" rx="14" fill="#19C82A" filter="url(#node-shadow)"/>
    <text x="1100" y="586" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Growth</text>

    <!-- Growth children -->
    <rect x="1140" y="522" width="80" height="36" rx="10" fill="#E8FFF4" stroke="#19C82A" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1180" y="545" text-anchor="middle" font-size="11" fill="#0a7a14" font-weight="500">Read book</text>

    <rect x="1140" y="602" width="80" height="36" rx="10" fill="#E8FFF4" stroke="#19C82A" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1170" y="625" text-anchor="middle" font-size="11" fill="#0a7a14" font-weight="500">Project</text>
    <rect x="1192" y="613" width="26" height="14" rx="5" fill="#19C82A" opacity="0.18"/>
    <text x="1205" y="624" text-anchor="middle" font-size="9" fill="#0a7a14" font-weight="700">tu,fr</text>

  </g>

  <!-- ── Bottom: summary chip ── -->
  <g transform="translate(540, 640)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#fff" stroke="#e1e3e8"/>
    <circle cx="20" cy="16" r="5" fill="#F24E1E"/>
    <text x="32" y="20" font-size="11" fill="#1a1a2e" font-weight="600">3</text>
    <circle cx="62" cy="16" r="5" fill="#A259FF"/>
    <text x="74" y="20" font-size="11" fill="#1a1a2e" font-weight="600">2</text>
    <circle cx="100" cy="16" r="5" fill="#1ABCFE"/>
    <text x="112" y="20" font-size="11" fill="#1a1a2e" font-weight="600">3</text>
    <circle cx="138" cy="16" r="5" fill="#19C82A"/>
    <text x="150" y="20" font-size="11" fill="#1a1a2e" font-weight="600">2</text>
    <text x="172" y="20" font-size="11" fill="#6b6b80" font-weight="600">10 total</text>
  </g>
</svg>
